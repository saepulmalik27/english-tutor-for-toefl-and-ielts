version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: english-tutor-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: englishtutor
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
